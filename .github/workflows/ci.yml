name: Frontend
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deterministic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          set-safe-directory: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run hooks:install
      - run: npm run check
      - run: npm run build
      - run: npm run perf:check
      - run: npm exec --no -- playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:a11y
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          set-safe-directory: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run deps:audit
  required:
    if: always()
    needs: [deterministic, security]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require successful mandatory jobs
        env:
          DETERMINISTIC: ${{ needs.deterministic.result }}
          SECURITY: ${{ needs.security.result }}
        run: test "$DETERMINISTIC" = success && test "$SECURITY" = success
