name: Frontend
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deterministic:
    needs: security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          set-safe-directory: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run hooks:install
      - run: python3 -B scripts/privacy-install.py
      - run: npm run check
      - run: npm run build
      - run: npm run perf:check
      - run: npm exec --no -- playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:a11y
      - name: Retain the verified static build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: brikuma-frontend-${{ github.sha }}-${{ github.run_attempt }}
          path: out/
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: false
      - name: Retain browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-failure
          path: |
            artifacts/playwright/
            artifacts/playwright-report/
            artifacts/screenshots/
            artifacts/editor/
            artifacts/editor-ux/
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: false
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          set-safe-directory: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run deps:audit
  required:
    if: always()
    needs: [deterministic, security]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require successful mandatory jobs
        env:
          DETERMINISTIC: ${{ needs.deterministic.result }}
          SECURITY: ${{ needs.security.result }}
        run: test "$DETERMINISTIC" = success && test "$SECURITY" = success
